name: APK beta

# Construye el APK de release y lo publica como asset de GitHub Releases, que es
# el bloque "Releases" que aparece al final de la página del repositorio.
#
# - Push a main (o sea, cuando se mergea tu PR): reemplaza el APK de la release
#   rodante "beta". La URL de descarga nunca cambia:
#   https://github.com/laplace71/gowayki-nest/releases/download/beta/wayki-nest-beta.apk
# - Push de un tag v*: crea una release propia (v1.0.0, v1.1.0, ...).
# - Manual: pestaña Actions > "APK beta" > Run workflow.
#
# Firma (opcional): si existen los secretos RELEASE_KEYSTORE_* se usa ese
# keystore. Si no, se usa androidApp/keystore/wayki-beta.jks cuando está en el
# repo, y como último recurso un keystore temporal (la firma cambia en cada
# build y Android no deja instalar encima; solo sirve para probar).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BETA_TAG: beta
  BETA_ASSET: wayki-nest-beta.apk

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: el changelog sale de los commits

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js (conversión de iconos SVG)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calcular versión y destino
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            asset="wayki-nest-${version}.apk"
            case "$version" in
              *-*) prerelease=true ;;
              *)   prerelease=false ;;
            esac
          else
            tag="$BETA_TAG"
            version="1.0.0-beta.${GITHUB_RUN_NUMBER}"
            asset="$BETA_ASSET"
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset=$asset"
            echo "code=$((1000 + GITHUB_RUN_NUMBER))"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          # Commit de la beta anterior: de ahí sale el changelog.
          prev=""
          if git rev-parse -q --verify "refs/tags/$BETA_TAG" >/dev/null 2>&1; then
            prev=$(git rev-parse "refs/tags/$BETA_TAG")
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Construir APK de release
        run: >
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace
          -Pwayki.versionName=${{ steps.meta.outputs.version }}
          -Pwayki.versionCode=${{ steps.meta.outputs.code }}

      - name: Firmar y alinear el APK
        id: firmar
        env:
          KS_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_origen=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          [ -n "$apk_origen" ] || { echo "::error::No se generó ningún APK"; exit 1; }
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          salida="$RUNNER_TEMP/${{ steps.meta.outputs.asset }}"
          keystore="$RUNNER_TEMP/wayki.keystore"

          if [ -n "${KS_BASE64:-}" ]; then
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            echo "Firmando con RELEASE_KEYSTORE_BASE64 (firma estable)."
          elif [ -f androidApp/keystore/wayki-beta.jks ]; then
            cp androidApp/keystore/wayki-beta.jks "$keystore"
            KS_PASS="${BETA_KEYSTORE_PASSWORD:-wayki-beta}"
            KEY_ALIAS="${BETA_KEY_ALIAS:-wayki}"
            KEY_PASS="${BETA_KEY_PASSWORD:-wayki-beta}"
            echo "Firmando con el keystore beta del repo (firma estable)."
          else
            keytool -genkeypair -v -keystore "$keystore" \
              -storepass wayki-beta -keypass wayki-beta -alias wayki \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Wayki Nest, OU=Wayki, O=Wayki, L=Arequipa, ST=Arequipa, C=PE"
            KS_PASS=wayki-beta
            KEY_ALIAS=wayki
            KEY_PASS=wayki-beta
            echo "::warning::Sin keystore fijo: la firma cambia en cada build y Android no dejará instalar la beta encima de la anterior. Configura RELEASE_KEYSTORE_BASE64 o añade androidApp/keystore/wayki-beta.jks."
          fi

          "$build_tools/zipalign" -f -p 4 "$apk_origen" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$salida" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" verify --print-certs "$salida" | head -3
          {
            echo "apk=$salida"
            echo "sha256=$(sha256sum "$salida" | cut -d' ' -f1)"
            echo "bytes=$(stat -c%s "$salida")"
            echo "cert=$("$build_tools/apksigner" verify --print-certs "$salida" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          } >> "$GITHUB_OUTPUT"

      - name: Generar notas de la release
        id: notas
        env:
          PREV: ${{ steps.meta.outputs.prev }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          CODE: ${{ steps.meta.outputs.code }}
          SHA256: ${{ steps.firmar.outputs.sha256 }}
          BYTES: ${{ steps.firmar.outputs.bytes }}
          CERT: ${{ steps.firmar.outputs.cert }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short "$GITHUB_SHA")

          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..$GITHUB_SHA")" -gt 0 ]; then
            cambios=$(git log --no-merges --pretty='- %s (`%h`)' "$PREV..$GITHUB_SHA" | head -40)
            comparar="https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...${GITHUB_SHA}"
          else
            cambios="- Sin cambios de código desde la beta anterior."
            comparar=""
          fi

          tamano=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')

          {
            echo "## Wayki Nest $VERSION"
            echo
            echo "APK beta compilada y firmada automáticamente desde \`main\`."
            echo
            echo "### Cambios"
            echo
            echo "$cambios"
            if [ -n "$comparar" ]; then
              echo
              echo "[Ver comparación completa]($comparar)"
            fi
            echo
            echo "### Instalación"
            echo
            echo "1. Descarga \`$ASSET\`."
            echo "2. Permite *instalar apps de origen desconocido* cuando Android lo pida."
            echo "3. Si ya tienes una beta instalada, se actualiza encima: no hace falta desinstalar."
            echo
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Versión | $VERSION (versionCode $CODE) |"
            echo "| Tamaño | $tamano |"
            echo "| Requisitos | Android 7.0 (API 24) o superior |"
            echo "| Commit | [\`$short_sha\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| Certificado | \`$CERT\` |"
            echo
            echo "### Verificar la descarga"
            echo
            echo '```bash'
            echo "sha256sum $ASSET"
            echo "# debe imprimir el SHA-256 de la tabla de arriba"
            echo '```'
            echo
            echo "### Notas"
            echo
            echo "- Build de pruebas (canal *beta*): no usar en producción ni publicar en Play Store."
            echo "- Este asset se reemplaza en cada push a \`main\`; el histórico queda en [Actions](https://github.com/$GITHUB_REPOSITORY/actions/workflows/apk.yml)."
          } > "$RUNNER_TEMP/notas.md"

          echo "body=$RUNNER_TEMP/notas.md" >> "$GITHUB_OUTPUT"

      - name: Mover el tag beta al commit actual
        if: github.ref_type != 'tag'
        run: |
          git tag -f "$BETA_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$BETA_TAG"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Wayki Nest ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notas.outputs.body }}
          files: ${{ steps.firmar.outputs.apk }}
