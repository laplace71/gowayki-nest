name: APK y release

# Construye el APK de release y lo publica en GitHub Releases: es el bloque
# "Releases" de la barra lateral del repo, con la tarjeta "Latest" arriba y la
# lista de versiones debajo.
#
# - Push a main (o sea, cuando se mergea tu PR): crea una release NUEVA con su
#   propio tag v1.0.<n>, publicada como estable para que GitHub le ponga el
#   sello "Latest". La lista de releases crece sola, una por merge.
#   La URL de descarga no cambia nunca porque apunta a la última release:
#   https://github.com/laplace71/gowayki-nest/releases/latest/download/wayki-nest-beta.apk
# - Push de un tag v*: crea esa release tal cual (v1.1.0, v2.0.0, ...). Si el
#   tag lleva guion (v1.1.0-beta.1) se publica como pre-release y no se lleva
#   el sello "Latest".
# - Manual: pestaña Actions > "APK y release" > Run workflow.
#
# Firma: NO es opcional. Android no instala un APK sin firma, así que el step
# "Firmar y alinear el APK" corre siempre. Lo que puede variar es el keystore,
# en este orden:
#   1. secretos RELEASE_KEYSTORE_* -> firma privada, para publicar en serio
#      (Play Store). Requiere ser admin del repo para cargarlos.
#   2. androidApp/keystore/wayki-beta.jks -> firma estable y pública, la que se
#      usa hoy: cada beta se instala encima de la anterior sin desinstalar.
#   3. keystore temporal -> solo si no existe ninguno de los dos. El APK se
#      instala, pero cada build tiene firma distinta y Android rechaza la
#      actualización encima: hay que desinstalar antes de instalar la nueva.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Nombre fijo del asset: así /releases/latest/download/wayki-nest-beta.apk
  # siempre sirve el APK más reciente sin importar el tag de turno.
  ASSET: wayki-nest-beta.apk

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: el changelog sale de los commits

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js (conversión de iconos SVG)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calcular versión y destino
        id: meta
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            case "$version" in
              *-*) prerelease=true ;;
              *)   prerelease=false ;;
            esac
          else
            # Cada push a main = una versión nueva. GITHUB_RUN_NUMBER nunca se
            # repite, así que el tag es único y la lista de releases crece.
            version="1.0.${GITHUB_RUN_NUMBER}"
            tag="v${version}"
            prerelease=false
          fi
          asset="$ASSET"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset=$asset"
            echo "code=$((1000 + GITHUB_RUN_NUMBER))"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          # Release anterior (el tag v* más nuevo, sin contar el de este run):
          # de ahí sale el changelog.
          prev=""
          candidato=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
          if [ -n "$candidato" ]; then
            prev=$(git rev-parse "$candidato")
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: Construir APK de release
        run: >
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace
          -Pwayki.versionName=${{ steps.meta.outputs.version }}
          -Pwayki.versionCode=${{ steps.meta.outputs.code }}

      - name: Firmar y alinear el APK
        id: firmar
        env:
          KS_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_origen=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          [ -n "$apk_origen" ] || { echo "::error::No se generó ningún APK"; exit 1; }
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          salida="$RUNNER_TEMP/${{ steps.meta.outputs.asset }}"
          keystore="$RUNNER_TEMP/wayki.keystore"

          if [ -n "${KS_BASE64:-}" ]; then
            printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
            echo "Firmando con RELEASE_KEYSTORE_BASE64 (firma estable)."
          elif [ -f androidApp/keystore/wayki-beta.jks ]; then
            cp androidApp/keystore/wayki-beta.jks "$keystore"
            KS_PASS="${BETA_KEYSTORE_PASSWORD:-wayki-beta}"
            KEY_ALIAS="${BETA_KEY_ALIAS:-wayki}"
            KEY_PASS="${BETA_KEY_PASSWORD:-wayki-beta}"
            echo "Firmando con el keystore beta del repo (firma estable)."
          else
            keytool -genkeypair -v -keystore "$keystore" \
              -storepass wayki-beta -keypass wayki-beta -alias wayki \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Wayki Nest, OU=Wayki, O=Wayki, L=Arequipa, ST=Arequipa, C=PE"
            KS_PASS=wayki-beta
            KEY_ALIAS=wayki
            KEY_PASS=wayki-beta
            echo "::warning::Sin keystore fijo: la firma cambia en cada build y Android no dejará instalar la beta encima de la anterior. Configura RELEASE_KEYSTORE_BASE64 o añade androidApp/keystore/wayki-beta.jks."
          fi

          "$build_tools/zipalign" -f -p 4 "$apk_origen" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$salida" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" verify "$salida"
          echo "apk=$salida" >> "$GITHUB_OUTPUT"

      - name: Generar notas de la release
        id: notas
        env:
          PREV: ${{ steps.meta.outputs.prev }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail

          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..$GITHUB_SHA")" -gt 0 ]; then
            cambios=$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_SHA" | head -40)
            comparar="https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...${GITHUB_SHA}"
          elif [ -z "$PREV" ]; then
            # Primera release del esquema nuevo: no hay versión anterior contra
            # la cual comparar, así que se listan los últimos commits.
            cambios=$(git log --no-merges --pretty='- %s' -15 "$GITHUB_SHA")
            comparar=""
          else
            cambios="- Sin cambios de código desde la versión anterior."
            comparar=""
          fi

          {
            echo "## Wayki Nest $VERSION"
            echo
            echo "APK compilada y firmada automáticamente desde \`main\`."
            echo
            echo "### Cambios"
            echo
            echo "$cambios"
            if [ -n "$comparar" ]; then
              echo
              echo "[Ver comparación completa]($comparar)"
            fi
            echo
            echo "### Instalación"
            echo
            echo "1. Descarga \`$ASSET\`."
            echo "2. Permite *instalar apps de origen desconocido* cuando Android lo pida."
            echo "3. Si ya tienes una versión instalada, se actualiza encima: no hace falta desinstalar."
            echo
            echo "### Notas"
            echo
            echo "- Cada push a \`main\` publica una versión nueva; esta es la **$VERSION**."
            echo "- Descarga siempre la última: [releases/latest](https://github.com/$GITHUB_REPOSITORY/releases/latest)."
          } > "$RUNNER_TEMP/notas.md"

          echo "body=$RUNNER_TEMP/notas.md" >> "$GITHUB_OUTPUT"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Wayki Nest ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: "true"
          body_path: ${{ steps.notas.outputs.body }}
          files: ${{ steps.firmar.outputs.apk }}
