name: APK beta

# Construye el APK de release y lo publica como asset de GitHub Releases, que es
# el bloque "Releases" que aparece al final de la página del repositorio.
#
# - Push a main (o sea, cuando se mergea tu PR): reemplaza el APK de la release
#   rodante "beta". La URL de descarga nunca cambia:
#   https://github.com/laplace71/gowayki-nest/releases/download/beta/wayki-nest-beta.apk
# - Push de un tag v*: crea una release propia (v1.0.0, v1.1.0, ...).
# - Manual: pestaña Actions > "APK beta" > Run workflow.
#
# Firma: NO es opcional y NO es pública. Se usan los secretos
# RELEASE_KEYSTORE_* del repo; si no están configurados, el workflow falla en
# vez de caer en un keystore commiteado o temporal. Un keystore cuyo privado
# puede leer cualquiera con acceso de lectura al repo permite falsificar una
# "beta oficial" y Android no podría distinguirla (CWE-321).
#
# versionCode y firma se comprueban contra el estado de la release beta antes
# de publicar (scripts/release-state.sh), tanto aquí como en publicar-apk.sh:
# una publicación nunca puede degradar el código ni cambiar la firma de la
# beta ya instalada.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # Todas las publicaciones que van a la release "beta" comparten un grupo,
  # vengan de un push a main o de un Run workflow en otra rama. Así no pueden
  # terminar en orden distinto el movimiento del tag y la subida del asset.
  # Las releases de tag v* tienen su propio grupo.
  group: apk-${{ github.ref_type == 'tag' && github.ref || 'beta' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BETA_TAG: beta
  BETA_ASSET: wayki-nest-beta.apk

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # para scripts/release-state.sh
      BACKEND_URL: ${{ secrets.BACKEND_URL }}  # lo consume generateAppConfig
      # Opt-in del canal beta: hoy el backend es una IP sin TLS. Borrar esta
      # variable (o ponerla a 0) vuelve a exigir HTTPS y revierte CWE-319.
      BACKEND_ALLOW_HTTP: ${{ vars.BACKEND_ALLOW_HTTP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historial completo: el changelog sale de los commits

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js (conversión de iconos SVG)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calcular versión y destino
        id: meta
        run: |
          set -euo pipefail
          # Ninguna release se publica con el backend por defecto: el login
          # envía DNI y PIN (CWE-319). Se exige HTTPS salvo opt-in explícito
          # del canal beta mediante la variable del repo BACKEND_ALLOW_HTTP=1.
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::Falta el secreto BACKEND_URL. Configúralo antes de publicar."
            exit 1
          fi
          insecure_backend=no
          case "$BACKEND_URL" in
            https://*) ;;
            http://*)
              if [[ "${BACKEND_ALLOW_HTTP:-}" != "1" && "${BACKEND_ALLOW_HTTP:-}" != "true" ]]; then
                echo "::error::BACKEND_URL usa http:// (DNI y PIN sin cifrar). Usa https:// o activa la variable del repo BACKEND_ALLOW_HTTP=1 para asumir el riesgo."
                exit 1
              fi
              insecure_backend=yes
              echo "::warning::BACKEND_URL usa http://: DNI y PIN viajan sin cifrar (riesgo asumido para la beta; CWE-319 queda abierto)."
              ;;
            *) echo "::error::BACKEND_URL debe empezar por http:// o https://"; exit 1 ;;
          esac
          echo "insecure_backend=$insecure_backend" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            asset="wayki-nest-${version}.apk"
            case "$version" in
              *-*) prerelease=true ;;
              *)   prerelease=false ;;
            esac
          else
            tag="$BETA_TAG"
            version="1.0.0-beta.${GITHUB_RUN_NUMBER}"
            asset="$BETA_ASSET"
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "asset=$asset"
            # Una sola secuencia monotónica para CI y publicaciones locales.
            echo "code=$(./scripts/release-state.sh next-code "$BETA_TAG")"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "prev=$(git rev-parse "$BETA_TAG" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Construir APK de release
        run: >
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace
          -Pwayki.versionName=${{ steps.meta.outputs.version }}
          -Pwayki.versionCode=${{ steps.meta.outputs.code }}

      - name: Firmar y alinear el APK
        id: firmar
        env:
          KS_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail
          apk_origen=$(find androidApp/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          [ -n "$apk_origen" ] || { echo "::error::No se generó ningún APK"; exit 1; }
          build_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          salida="$RUNNER_TEMP/${{ steps.meta.outputs.asset }}"
          keystore="$RUNNER_TEMP/wayki.keystore"

          if [ -z "${KS_BASE64:-}" ] || [ -z "${KS_PASS:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "::error::Faltan los secretos RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS o RELEASE_KEY_PASSWORD. Configúralos antes de publicar; no se usa una clave pública de respaldo."
            exit 1
          fi
          printf '%s' "$KS_BASE64" | base64 -d > "$keystore"
          echo "Firmando con el keystore privado de los secretos del repo."

          "$build_tools/zipalign" -f -p 4 "$apk_origen" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$salida" "$RUNNER_TEMP/alineado.apk"
          "$build_tools/apksigner" verify "$salida"

          # Datos verificables para las notas y para el control de publicación.
          sha256=$(sha256sum "$salida" | cut -d' ' -f1)
          bytes=$(stat -c%s "$salida")
          cert=$("$build_tools/apksigner" verify --print-certs "$salida" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ -n "$cert" ] || { echo "::error::No se pudo leer la huella SHA-256 del certificado"; exit 1; }

          # Rechaza un APK más antiguo o firmado con otra clave que el beta vigente.
          ./scripts/release-state.sh assert "$CODE" "$cert" "$BETA_TAG"

          {
            echo "apk=$salida"
            echo "sha256=$sha256"
            echo "bytes=$bytes"
            echo "cert=$cert"
          } >> "$GITHUB_OUTPUT"

      - name: Generar notas de la release
        id: notas
        env:
          PREV: ${{ steps.meta.outputs.prev }}
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          CODE: ${{ steps.meta.outputs.code }}
          SHA256: ${{ steps.firmar.outputs.sha256 }}
          BYTES: ${{ steps.firmar.outputs.bytes }}
          CERT: ${{ steps.firmar.outputs.cert }}
          INSECURE_BACKEND: ${{ steps.meta.outputs.insecure_backend }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short "$GITHUB_SHA")

          if [ -n "$PREV" ] && [ "$(git rev-list --count "$PREV..$GITHUB_SHA")" -gt 0 ]; then
            cambios=$(git log --no-merges --pretty='- %s (`%h`)' "$PREV..$GITHUB_SHA" | head -40)
            comparar="https://github.com/$GITHUB_REPOSITORY/compare/${PREV}...${GITHUB_SHA}"
          else
            cambios="- Sin cambios de código desde la beta anterior."
            comparar=""
          fi

          tamano=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f MB", b / 1048576 }')

          {
            echo "## Wayki Nest $VERSION"
            echo
            echo "APK beta compilada y firmada automáticamente desde \`main\`."
            echo
            echo "### Cambios"
            echo
            echo "$cambios"
            if [ -n "$comparar" ]; then
              echo
              echo "[Ver comparación completa]($comparar)"
            fi
            echo
            echo "### Instalación"
            echo
            echo "1. Descarga \`$ASSET\`."
            echo "2. Permite *instalar apps de origen desconocido* cuando Android lo pida."
            echo "3. Si ya tienes una beta instalada, se actualiza encima: no hace falta desinstalar."
            echo
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Versión | $VERSION (versionCode $CODE) |"
            echo "| Tamaño | $tamano |"
            echo "| Requisitos | Android 7.0 (API 24) o superior |"
            echo "| Commit | [\`$short_sha\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo "| Certificado | \`$CERT\` |"
            echo
            echo "### Verificar la descarga"
            echo
            echo '```bash'
            echo "sha256sum $ASSET"
            echo "# debe imprimir el SHA-256 de la tabla de arriba"
            echo '```'
            echo
            echo "### Notas"
            echo
            if [ "$INSECURE_BACKEND" = "yes" ]; then
              echo "- ⚠️ Esta beta usa \`http://\`: DNI y PIN viajan sin cifrar (CWE-319, riesgo asumido mientras el backend no tenga TLS)."
              echo
            fi
            echo "- Build de pruebas (canal *beta*): no usar en producción ni publicar en Play Store."
            echo "- Este asset se reemplaza en cada push a \`main\`; el histórico queda en [Actions](https://github.com/$GITHUB_REPOSITORY/actions/workflows/apk.yml)."
          } > "$RUNNER_TEMP/notas.md"

          echo "body=$RUNNER_TEMP/notas.md" >> "$GITHUB_OUTPUT"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Wayki Nest ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notas.outputs.body }}
          overwrite_files: true
          files: ${{ steps.firmar.outputs.apk }}

      - name: Mover el tag beta al commit actual
        if: github.ref_type != 'tag'
        run: |
          # El asset ya está publicado: el tag avanza después, nunca antes,
          # para que movimiento de tag y subida no puedan invertir su orden.
          git tag -f "$BETA_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$BETA_TAG"
