#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native on Linux (host no soporta targets iOS)
kotlin.native.ignoreDisabledTargets=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Backend beta: la VPS aún no tiene TLS. Opt-in explícito para que los builds
# de Android Studio (sin variables de entorno) usen el BACKEND_URL del .env.
wayki.backend.allowHttp=true